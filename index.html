<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabStock — Accesso</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080812;
  --surface:#0e0e1c;
  --surface2:#14142a;
  --border:rgba(255,255,255,0.06);
  --blue:#4f7cff;
  --cyan:#00e5cc;
  --orange:#ff6b35;
  --pink:#ff3d9a;
  --text:#eeeeff;
  --muted:rgba(238,238,255,0.4);
  --glow-blue:rgba(79,124,255,0.35);
  --glow-cyan:rgba(0,229,204,0.3);
}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:var(--text);
}

/* Grid animata di sfondo */
.grid-bg{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(79,124,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,124,255,0.04) 1px, transparent 1px);
  background-size:60px 60px;
  animation:gridShift 20s linear infinite;
}
@keyframes gridShift{
  0%{background-position:0 0}
  100%{background-position:60px 60px}
}

/* Orbs di sfondo */
.orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(100px);opacity:0.18}
.orb1{width:600px;height:600px;background:var(--blue);top:-200px;left:-200px;animation:orbFloat 12s ease-in-out infinite}
.orb2{width:500px;height:500px;background:var(--cyan);bottom:-150px;right:-150px;animation:orbFloat 15s ease-in-out infinite reverse}
.orb3{width:300px;height:300px;background:var(--pink);top:50%;left:40%;animation:orbFloat 10s ease-in-out infinite 3s}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(40px,-30px) scale(1.08)}
  66%{transform:translate(-20px,20px) scale(0.95)}
}

/* Particelle floating */
.particles{position:fixed;inset:0;pointer-events:none}
.particle{
  position:absolute;width:2px;height:2px;
  background:var(--cyan);border-radius:50%;
  animation:particleFloat var(--dur) linear infinite;
  opacity:0;
}
@keyframes particleFloat{
  0%{transform:translateY(100vh) translateX(0);opacity:0}
  10%{opacity:0.6}
  90%{opacity:0.3}
  100%{transform:translateY(-100px) translateX(var(--drift));opacity:0}
}

/* Layout split */
.container{
  position:relative;z-index:10;
  display:grid;
  grid-template-columns:1fr 1fr;
  width:900px;
  min-height:560px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
  animation:containerIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes containerIn{
  from{opacity:0;transform:scale(0.92) translateY(40px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}

/* Lato sinistro — decorativo */
.left-panel{
  background:linear-gradient(135deg, #0a0a1f 0%, #0d0d28 100%);
  padding:52px 44px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  overflow:hidden;
  border-right:1px solid var(--border);
}
.left-panel::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(circle at 30% 40%, rgba(79,124,255,0.12) 0%, transparent 70%);
}

.brand{position:relative;z-index:1}
.brand-icon{
  width:52px;height:52px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  margin-bottom:20px;
  box-shadow:0 8px 32px var(--glow-blue);
  animation:iconPulse 3s ease-in-out infinite;
}
@keyframes iconPulse{
  0%,100%{box-shadow:0 8px 32px var(--glow-blue)}
  50%{box-shadow:0 8px 48px rgba(79,124,255,0.55)}
}
.brand-name{
  font-size:28px;font-weight:800;
  letter-spacing:-0.02em;
  background:linear-gradient(135deg,#fff,rgba(255,255,255,0.7));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.brand-name span{
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.brand-sub{color:var(--muted);font-size:13px;margin-top:6px;font-weight:400}

/* Stats decorativi nel pannello sinistro */
.left-stats{
  position:relative;z-index:1;
  display:flex;flex-direction:column;gap:14px;
}
.left-stat{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:14px;
  padding:14px 18px;
  display:flex;align-items:center;gap:14px;
  backdrop-filter:blur(10px);
  transform:translateX(-20px);opacity:0;
  animation:statIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
}
.left-stat:nth-child(1){animation-delay:0.4s}
.left-stat:nth-child(2){animation-delay:0.55s}
.left-stat:nth-child(3){animation-delay:0.7s}
@keyframes statIn{
  to{transform:translateX(0);opacity:1}
}
.stat-dot{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.stat-dot.blue{background:rgba(79,124,255,0.15)}
.stat-dot.cyan{background:rgba(0,229,204,0.12)}
.stat-dot.orange{background:rgba(255,107,53,0.12)}
.stat-info{flex:1}
.stat-info-label{font-size:11px;color:var(--muted);font-weight:500}
.stat-info-val{font-size:14px;font-weight:700;color:var(--text);margin-top:1px}

/* Lato destro — form */
.right-panel{
  padding:52px 44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.form-header{margin-bottom:36px}
.form-title{font-size:24px;font-weight:800;letter-spacing:-0.02em}
.form-sub{color:var(--muted);font-size:13px;margin-top:5px}

.field{margin-bottom:18px}
.field label{
  display:block;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.1em;
  color:var(--muted);margin-bottom:8px;
}
.input-wrap{position:relative}
.input-wrap .ico{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:15px;pointer-events:none;opacity:0.5;
}
input{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:13px 14px 13px 40px;
  color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;
  outline:none;
  transition:all 0.25s;
}
input:focus{
  border-color:var(--blue);
  background:rgba(79,124,255,0.06);
  box-shadow:0 0 0 3px rgba(79,124,255,0.12);
}
input::placeholder{color:rgba(238,238,255,0.18)}

.btn-login{
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--blue) 0%,#6b5fff 100%);
  border:none;border-radius:12px;
  color:#fff;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;font-weight:700;
  cursor:pointer;margin-top:4px;
  transition:all 0.25s;
  position:relative;overflow:hidden;
  letter-spacing:0.01em;
}
.btn-login::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);
  opacity:0;transition:opacity 0.25s;
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(79,124,255,0.45)}
.btn-login:hover::after{opacity:1}
.btn-login:active{transform:translateY(0)}
.btn-login.loading{pointer-events:none}
.btn-login.loading .btn-text{opacity:0}
.btn-login .spinner{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  display:none;
}
.btn-login.loading .spinner{display:block}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.error-box{
  background:rgba(255,61,154,0.08);
  border:1px solid rgba(255,61,154,0.2);
  border-radius:10px;padding:11px 14px;
  color:#ff6eb0;font-size:13px;
  margin-top:14px;display:none;
  animation:errIn 0.3s ease;
}
.error-box.show{display:flex;align-items:center;gap:8px}
@keyframes errIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

.divider{
  display:flex;align-items:center;gap:10px;
  margin:22px 0;color:var(--muted);font-size:12px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.reg-link{
  text-align:center;font-size:13px;color:var(--muted);
}
.reg-link a{
  color:var(--cyan);text-decoration:none;font-weight:600;
  transition:opacity 0.2s;
}
.reg-link a:hover{opacity:0.7}

@media(max-width:720px){
  .container{grid-template-columns:1fr;width:95vw}
  .left-panel{display:none}
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="particles" id="particles"></div>

<div class="container">
  <!-- Pannello sinistro -->
  <div class="left-panel">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-name">Lab<span>Stock</span></div>
      <div class="brand-sub">Sistema Gestione Magazzino</div>
    </div>
    <div class="left-stats">
      <div class="left-stat">
        <div class="stat-dot blue">📦</div>
        <div class="stat-info">
          <div class="stat-info-label">Gestione componenti</div>
          <div class="stat-info-val">Inventario in tempo reale</div>
        </div>
      </div>
      <div class="left-stat">
        <div class="stat-dot cyan">👥</div>
        <div class="stat-info">
          <div class="stat-info-label">Accesso per ruoli</div>
          <div class="stat-info-val">Admin · Tecnico · Professore</div>
        </div>
      </div>
      <div class="left-stat">
        <div class="stat-dot orange">📋</div>
        <div class="stat-info">
          <div class="stat-info-label">Liste esperienze</div>
          <div class="stat-info-val">Verifica disponibilità</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Form -->
  <div class="right-panel">
    <div class="form-header">
      <div class="form-title">Bentornato 👋</div>
      <div class="form-sub">Accedi al tuo account per continuare</div>
    </div>

    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <span class="ico">👤</span>
        <input type="text" id="username" placeholder="Il tuo username" autocomplete="username">
      </div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <span class="ico">🔒</span>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="login()">
      <span class="btn-text">Accedi →</span>
      <div class="spinner"></div>
    </button>

    <div class="error-box" id="errorBox">
      <span>⚠</span><span id="errorMsg"></span>
    </div>

    <div class="divider">sei un professore?</div>
    <div class="reg-link"><a href="register.html">Registrati per richiedere l'accesso</a></div>
  </div>
</div>

<script>
const API = "http://127.0.0.1:5000";

// Particelle
const pc = document.getElementById('particles');
for(let i=0;i<25;i++){
  const p = document.createElement('div');
  p.className='particle';
  p.style.cssText=`left:${Math.random()*100}%;--dur:${8+Math.random()*12}s;--drift:${(Math.random()-0.5)*200}px;animation-delay:${Math.random()*15}s;background:${Math.random()>0.5?'var(--cyan)':'var(--blue)'}`;
  pc.appendChild(p);
}

document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});

async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');
  hideError();

  if(!username||!password){showError('Inserisci username e password');return}

  btn.classList.add('loading');
  try{
    const res=await fetch(`${API}/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password})
    });
    const data=await res.json();
    if(!res.ok){showError(data.error||'Errore login');return}
    localStorage.setItem('token',data.token);
    localStorage.setItem('username',data.username);
    localStorage.setItem('ruolo',data.ruolo);
    // Animazione di uscita
    document.querySelector('.container').style.animation='containerOut 0.4s cubic-bezier(0.7,0,1,1) forwards';
    setTimeout(()=>window.location.href='dashboard.html',380);
  }catch{
    showError('Impossibile raggiungere il server. Backend avviato?');
  }finally{
    btn.classList.remove('loading');
  }
}

function showError(msg){
  document.getElementById('errorMsg').textContent=msg;
  document.getElementById('errorBox').classList.add('show');
}
function hideError(){document.getElementById('errorBox').classList.remove('show')}

if(localStorage.getItem('token'))window.location.href='dashboard.html';

// Aggiungi animazione uscita
const style=document.createElement('style');
style.textContent='@keyframes containerOut{to{opacity:0;transform:scale(0.94) translateY(-20px)}}';
document.head.appendChild(style);
</script>
</body>
</html>
